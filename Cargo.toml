[package]
name = "vmlab"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-host virtual machine lab orchestrator"
# guest/ holds the micro-VM guest-side crates and build assets; only the
# wire-contract crates guest/cinit-proto and guest/agent-proto are consumed
# here (as path dependencies below). The rest — notably guest/cinit and
# guest/agent, which build for guest targets and allow unsafe — must never be
# swept into this package. ebpf/ is the BPF fast-path workspace (nightly +
# bpf-linker, allows unsafe); only its committed objects under
# src/net/fastpath/bpf/ are consumed here. tap/ is the TAP-ioctl helper
# (allows unsafe), consumed as a path dependency behind the ebpf feature.
exclude = ["/guest", "/ebpf", "/tap"]

[lib]
name = "vmlab"
path = "src/lib.rs"

# The CLI binary (supervisor + lab daemons ride along as hidden subcommands).
[[bin]]
name = "vmlab"
path = "src/main.rs"

[features]
default = ["ebpf"]
# The eBPF network fast path (PRD §9.1's substitutable backend): compiled in
# by default; an empirical probe at daemon startup decides per-host whether a
# kernel tier is actually used, falling back to the userspace fabric.
ebpf = ["dep:aya", "dep:vmlab-tap", "dep:command-fds"]

[dependencies]
wcl_lang = { git = "https://github.com/wiltaylor/wcl.git", rev = "e9636a2ac10a4f5b1a69c13a2212e35cb5a64e62" }
wscript = { git = "https://github.com/Configweave/wscript.git", rev = "c631c6b724ebcc38a9ae53235b20bf10ba64dc51" }
# Host <-> micro-VM init contract (container.json + the ctl channel) for OCI
# containers in labs. Shared with the guest init (guest/cinit); plain serde,
# so it builds for the host like any other dependency.
vmlab-cinit-proto = { path = "guest/cinit-proto" }
# Host <-> vmlab-agent contract (frame mux: terminals, exec, files, metrics)
# for VMs and containers. Shared with the guest agent (guest/agent).
vmlab-agent-proto = { path = "guest/agent-proto" }

anyhow = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
socket2 = "0.6"
futures = "0.3"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

sha2 = "0.11"
hex = "0.4"
rand = "0.10"
base64 = "0.23"
zstd = "0.13"
flate2 = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
# `net` is for if_nametoindex (the afxdp tier's XDP map keys); `inotify` is
# the workspace syncer's host-side watcher (§19.6), which registers per
# directory rather than recursively so a guest-owned tree costs no watch
# descriptors.
nix = { version = "0.31", features = ["process", "signal", "user", "fs", "net", "inotify", "poll"] }
image = { version = "0.25", default-features = false, features = ["png", "pnm", "bmp"] }
# 0.13 renamed the `rustls-tls` feature to `rustls` and moved
# `RequestBuilder::query` behind its own `query` feature.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query"] }
tar = "0.4"
glob = "0.3"
tempfile = "3"
ipnet = "2.12.0"
async-trait = "0.1.91"
# `net` is for sockopt::socket_cookie (SO_COOKIE), the sockmap fast path's
# per-socket BPF map key.
rustix = { version = "1.1.4", features = ["termios", "net"] }
# The eBPF loader for the network fast path. Its userspace API is safe, so
# the crate-level `unsafe_code = "deny"` holds.
aya = { version = "0.14", optional = true }
# TAP creation for the afxdp tier (the unsafe ioctls live in that crate).
vmlab-tap = { path = "tap", optional = true }
# Passes pre-opened tap fds to QEMU at spawn (dup2 shuffle in pre_exec).
command-fds = { version = "0.3", optional = true }
# The SSH server the facade terminates on the host (PRD §19.3, ADR-0012).
# `ring` rather than the default `aws-lc-rs` backend: it needs no cmake/clang
# at build time. No `rsa` and no `flate2` — vmlab owns both ends of the host
# key and a client that negotiates compression over a unix socket gains
# nothing.
russh = { version = "0.62.5", default-features = false, features = ["ring"] }
# ripgrep's own gitignore engine, for the workspace syncer's ignore rules
# (PRD §19.6). Only `ignore::gitignore` is used — vmlab owns the walk, because
# the syncer has to descend a directory to learn its rules. Not hand-rolled:
# an ignore rule that silently means something slightly different from what
# `git` reads is the silent-divergence failure class §19.6 exists to refuse.
ignore = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# test-util enables tokio::time::{pause, advance} for clock-driven expiry tests.
tokio = { version = "1", features = ["full", "test-util"] }

# The pinned wscript release has no host-type alias primitive. These two small
# crates are vendored from that exact revision with the registry/checker support
# needed to keep historical template scripts source-compatible (issue #67).
[patch."https://github.com/Configweave/wscript.git"]
wscript-core = { path = "vendor/wscript-core" }
wscript-compiler = { path = "vendor/wscript-compiler" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
todo = "warn"
dbg_macro = "warn"
