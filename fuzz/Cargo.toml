[package]
name = "vmlab-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
vmlab-disk = { path = "../hv/crates/vmlab-disk" }
vmlab-hv-proto = { path = "../hv/crates/vmlab-hv-proto" }

[workspace]
members = ["."]

[[bin]]
name = "qcow2"
path = "fuzz_targets/qcow2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hv_proto"
path = "fuzz_targets/hv_proto.rs"
test = false
doc = false
bench = false
