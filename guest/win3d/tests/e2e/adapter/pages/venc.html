<!doctype html><meta charset=utf-8><title>venc</title>
<body style="font:22px monospace;background:#fff"><pre id=o></pre><script>
// The page of card #140, GitHub #238: ask the browser for a hardware video
// encoder, which makes a Chromium GPU process load d3d12.dll, then keep
// trying WebGL for 20 s. A GPU process that ended itself over the load shows
// as 'NO WEBGL' or as a software renderer on a later line. The result also
// goes to the browser's log, where tests/e2e/adapter/guest/Run-Page.ps1 reads it.
const result = {page: 'venc', before: null, after: [], webgpu: null, encoder: null, error: null};
const log = s => { o.textContent += new Date().toTimeString().slice(0,8) + ' ' + s + '\n'; };
function gl(){ const c = document.createElement('canvas'); const g = c.getContext('webgl'); if (!g) return 'NO WEBGL';
  const e = g.getExtension('WEBGL_debug_renderer_info'); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : 'webgl ok'; }
(async () => {
  result.before = gl(); log('webgl before: ' + result.before);
  try { const ad = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
        result.webgpu = ad ? [ad.info.vendor, ad.info.architecture, ad.info.description].join(' / ') : 'no adapter';
        log('webgpu: ' + result.webgpu); } catch (e) { result.webgpu = 'threw ' + e; log('webgpu threw ' + e); }
  try { const r = await VideoEncoder.isConfigSupported({codec:'avc1.42001f', width:1280, height:720, bitrate:2e6, framerate:30, hardwareAcceleration:'prefer-hardware'});
        result.encoder = 'supported: ' + r.supported;
        log('hardware H.264 encoder supported: ' + r.supported); } catch (e) { result.encoder = 'threw ' + e; log('isConfigSupported threw ' + e); }
  for (let i = 1; i <= 5; i++) { await new Promise(r => setTimeout(r, 4000)); const g = gl(); result.after.push(g); log('webgl after ' + i*4 + ' s: ' + g); }
  log('done');
  console.log('WIN3D-RESULT ' + btoa(unescape(encodeURIComponent(JSON.stringify(result)))));
})().catch(e => { result.error = String(e); console.log('WIN3D-RESULT ' + btoa(unescape(encodeURIComponent(JSON.stringify(result))))); });
</script>
