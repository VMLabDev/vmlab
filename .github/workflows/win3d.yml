name: Windows 3D driver checks

# Same branch filter as ci.yml: not on card branches or next (D12).
permissions:
  contents: read

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'guest/win3d/**'
      - '.github/workflows/win3d.yml'
      - '.just/ci/**'
  pull_request:
    branches: [main]
    paths:
      - 'guest/win3d/**'
      - '.github/workflows/win3d.yml'
      - '.just/ci/**'

jobs:
  light:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: taiki-e/install-action@59efbae88300b1298fd71ecd2fc553f6dcbd1c96 # uv
      - run: just ci::win3d-check
