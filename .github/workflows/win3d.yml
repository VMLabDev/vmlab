name: Windows 3D driver checks

on:
  push:
    paths:
      - 'guest/win3d/**'
      - '.github/workflows/win3d.yml'
      - '.just/ci/**'
  pull_request:
    paths:
      - 'guest/win3d/**'
      - '.github/workflows/win3d.yml'
      - '.just/ci/**'

jobs:
  light:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@uv
      - run: just ci::win3d-check
