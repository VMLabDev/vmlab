name: Bounded parser fuzzing

on:
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: read

concurrency:
  group: parser-fuzz-next
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: next
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-21
          components: rust-src
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz each parser for 60 seconds
        run: just fuzz 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: parser-fuzz-artifacts
          path: target/fuzz-runs/
