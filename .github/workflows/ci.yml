name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # vmlab's tests probe the host for the tools it drives — QEMU emulators +
      # firmware (x86 OVMF, aarch64 AAVMF, riscv EDK2), swtpm, the ISO/floppy
      # builders (xorriso/mtools), the SMB server, and tesseract for OCR — so
      # install them.
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-system-misc qemu-utils \
            ovmf seabios swtpm \
            qemu-efi-aarch64 qemu-efi-riscv64 \
            tesseract-ocr passt \
            xorriso mtools dosfstools samba
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      # One part of the merge bar per step; `just ci::check` runs the same set
      # in one go.
      - run: just ci::fmt-check
      - run: just ci::lint
      - run: just ci::test

  # The guest-side crates (cinit, agent, and their proto contracts) are
  # standalone — never swept into the host build — so lint/test them and the
  # agent's cross targets (musl, windows-gnu) explicitly. cargo check on the
  # Windows target type-checks without needing a linker.
  guest-crates:
    name: guest crates (cinit + agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, riscv64gc-unknown-linux-musl, x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            guest/cinit-proto
            guest/cinit
            guest/agent-proto
            guest/agent
      - run: just ci::guest-check
      - run: just ci::guest-windows-check
      - run: just ci::guest-cross-build

  # The committed BPF fast-path objects (src/net/fastpath/bpf/) must match
  # the ebpf/ sources: rebuild with the pinned toolchain and byte-diff.
  # bpf-linker's LLVM proxy dlopens the pinned toolchain's libLLVM, so the
  # objects are deterministic given the rust-toolchain.toml pin + the
  # bpf-linker version pinned in scripts/guest-toolchains.sh (`just ebpf-tools`).
  ebpf-verify:
    name: ebpf objects match source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ebpf/rust-toolchain.toml selects the pinned nightly automatically;
      # install it (with rust-src) up front so cargo doesn't have to.
      - name: Install pinned ebpf toolchain
        run: |
          channel=$(grep '^channel' ebpf/rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$channel" --profile minimal --component rust-src
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ebpf
      - run: just ebpf-tools
      - run: just ci::ebpf-verify

  # ── Version ───────────────────────────────────────────────────────────────
  # Trailer-gated: a release only happens when HEAD carries a publish trailer.
  #   pre-release: true   → X.Y.Z-alpha, marked as a GitHub pre-release
  #   release: true       → X.Y.Z stable
  # Neither → CI runs tests only. The version is bumped from the last v* tag,
  # scanning conventional-commit subjects since that tag for the bump level
  # (0.x semantics: a breaking change bumps the minor, not the major).
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: calc
        run: |
          IS_RELEASE=$(git log -1 --format='%(trailers:key=release,valueonly)')
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')

          if [[ "$IS_RELEASE" != "true" && "$IS_PRERELEASE" != "true" ]]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No release/pre-release trailer on HEAD — tests only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Next version = bump from the last v* tag, scanning conventional
          # commits since that tag for the bump level (0.x: major -> minor).
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            PREV_MAJOR=0; PREV_MINOR=0; PREV_PATCH=0; RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"; VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' $RANGE)
          [[ "$BUMP" == "none" ]] && BUMP="patch"

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then MAJOR=0; MINOR=$((PREV_MINOR + 1)); PATCH=0
              else MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0; fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PRERELEASE=false
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            VERSION="${VERSION}-alpha"
            PRERELEASE=true
          fi

          echo "Calculated version: $VERSION (bump=$BUMP, prerelease=$PRERELEASE, from ${LAST_TAG:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Pre-release** | $PRERELEASE |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── Binary ────────────────────────────────────────────────────────────────
  # Build the version-stamped `vmlab` CLI for Linux x86_64 (vmlab drives
  # QEMU/KVM, so Linux is the only target). It is uploaded for the release job.
  build:
    name: Build vmlab (${{ matrix.target }})
    # The whole merge bar, not only the host job: a release is never cut from
    # a commit any part of `ci::check` rejected.
    needs: [version, check, guest-crates, ebpf-verify]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      - name: Stamp version
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i '0,/^version = ".*"$/s//version = "'"$V"'"/' Cargo.toml
      - name: Build CLI
        run: cargo build --bin vmlab --release --target ${{ matrix.target }}
      - name: Stage assets
        run: |
          V="${{ needs.version.outputs.version }}"
          cp "target/${{ matrix.target }}/release/vmlab" "vmlab-$V-${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: vmlab-${{ needs.version.outputs.version }}-${{ matrix.suffix }}
          retention-days: 1

  # ── Guest assets ──────────────────────────────────────────────────────────
  # Every guest asset the binary looks up on the host — the container micro-VM
  # kernel/initramfs for x86_64 and aarch64, every Rust agent target, every
  # legacy agent target — as one tarball install.sh deploys beside the binary.
  # `just guest-package` is strict: a target whose toolchain is missing fails
  # the job rather than shipping a partial set. scripts/guest-toolchains.sh is
  # the one list of what that takes; this job only caches the two slow stages.
  guest-assets:
    name: Build guest assets
    needs: [version, check, guest-crates, ebpf-verify]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - name: Install host packages
        run: ./scripts/guest-toolchains.sh apt
      - name: Install Rust toolchains
        run: ./scripts/guest-toolchains.sh rust
      # The msvcrt CRT is a ~5 minute build from source; key it on the script
      # that builds it and the mingw-w64 the runner's apt just installed.
      - name: Resolve mingw-w64 version
        id: mingw
        run: echo "version=$(dpkg-query -W -f='${Version}' mingw-w64-common)" >> "$GITHUB_OUTPUT"
      # Both caches sit at the default locations the build scripts look in.
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/vmlab/toolchains/mingw-msvcrt
          key: mingw-msvcrt-${{ runner.os }}-${{ steps.mingw.outputs.version }}-${{ hashFiles('guest/build-mingw-msvcrt.sh', 'scripts/guest-toolchains.sh') }}
      - name: Build msvcrt CRT
        run: ./scripts/guest-toolchains.sh msvcrt
      # OpenWatcom is a pinned 150 MB snapshot; the pin lives in the script.
      - uses: actions/cache@v6
        with:
          path: ~/.local/opt/open-watcom-v2
          key: open-watcom-${{ runner.os }}-${{ hashFiles('scripts/guest-toolchains.sh') }}
      - name: Install OpenWatcom
        run: ./scripts/guest-toolchains.sh watcom
      - uses: Swatinem/rust-cache@v2
        with:
          key: guest-assets
          workspaces: |
            guest/cinit
            guest/agent
      - name: Build and package
        run: just guest-package "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: guest-assets
          path: |
            target/guest-package/vmlab-guest-${{ needs.version.outputs.version }}.tar.gz
            target/guest-package/vmlab-guest-${{ needs.version.outputs.version }}.tar.gz.sha256
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  # Tag the commit and cut a GitHub (pre-)release with the binary and the
  # guest-asset bundle (and its checksum) attached.
  release:
    name: Create GitHub release
    needs: [version, build, guest-assets]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
      - uses: actions/download-artifact@v8
        with:
          path: dist
          name: guest-assets
      - name: Tag
        run: |
          V="${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**/*
