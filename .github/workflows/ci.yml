name: CI

# CI runs only on main and release/**. Card branches and next are validated
# locally with `just ci::check` (D12), so a push to them starts no workflow.
permissions:
  contents: read

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Each job has a timeout-minutes of its usual time plus a margin, and each apt
# step 20 minutes (VML-78): a hung apt mirror held the 0.44.0 release for 68
# minutes, and the GitHub default is 6 hours.
jobs:
  release-dry-run:
    name: Release supply-chain dry-run (no signing identity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: taiki-e/install-action@59efbae88300b1298fd71ecd2fc553f6dcbd1c96 # uv
      - run: just ci::release-dry-run

  # The fast gate: every fmt and clippy step of the host and hypervisor
  # workspaces, so a fmt or lint failure ends the run before the long test
  # jobs (`check`, `hv-check`) start. Those two jobs `need` this one and the
  # other fast jobs (`guest-crates`, `ebpf-verify`), which run beside it.
  fmt-lint:
    name: fmt + lint (host + hypervisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml
          components: rustfmt, clippy
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: taiki-e/install-action@59efbae88300b1298fd71ecd2fc553f6dcbd1c96 # uv
      # Paths Windows cannot check out (VML-60): no build needed.
      - run: just ci::path-check
      # VML-88: unguarded variable paths in shell scripts and just recipes (no build needed).
      - run: just ci::shell-paths
      # The fmt checks need no build: run them first.
      - run: just ci::fmt-check
      - run: just ci::hv-fmt-check
      # VML-78: apt fails fast on a dead mirror and retries.
      - name: Make apt fail fast
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-vmlab-ci
      # hv-lint builds against virglrenderer, the same way hv-check does.
      - name: Install native dependencies
        timeout-minutes: 20
        run: just ci::hv-test-native-deps-install
      - name: Resolve virglrenderer cache identity
        id: virgl
        run: just ci::hv-cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/virglrenderer-*
          key: hv-${{ runner.os }}-${{ runner.arch }}-${{ steps.virgl.outputs.key }}-${{ hashFiles('build/hv.py', 'build/hv-pins.toml') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: fmt-lint
      - run: just ci::lint
      - run: just ci::hv-lint

  # The job names of `check` and `hv-check` stay as they were, so required
  # status checks keep their names. Their fmt and lint steps run in `fmt-lint`.
  check:
    name: fmt + lint + test
    needs: [fmt-lint, guest-crates, ebpf-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # VML-78: apt fails fast on a dead mirror and retries.
      - name: Make apt fail fast
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-vmlab-ci
      # vmlab's tests probe the host for the tools it drives — QEMU emulators +
      # firmware (x86 OVMF, aarch64 AAVMF, riscv EDK2), swtpm, the ISO/floppy
      # builders (xorriso/mtools), the SMB server, and tesseract for OCR — so
      # install them.
      - name: Install runtime deps
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-system-misc qemu-utils \
            ovmf seabios swtpm \
            qemu-efi-aarch64 qemu-efi-riscv64 \
            tesseract-ocr passt \
            xorriso mtools dosfstools samba bubblewrap waypipe
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml
          components: rustfmt, clippy
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # One part of the merge bar per step; `just ci::check` runs the same set
      # in one go.
      - run: just ci::test
      - run: just ci::agent-conformance

  hv-check:
    name: hypervisor fmt + lint + test (no guests)
    needs: [fmt-lint, guest-crates, ebpf-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: taiki-e/install-action@59efbae88300b1298fd71ecd2fc553f6dcbd1c96 # uv
      # VML-78: apt fails fast on a dead mirror and retries.
      - name: Make apt fail fast
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-vmlab-ci
      - name: Install native dependencies
        timeout-minutes: 20
        run: just ci::hv-test-native-deps-install
      - name: Resolve virglrenderer cache identity
        id: virgl
        run: just ci::hv-cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/virglrenderer-*
          key: hv-${{ runner.os }}-${{ runner.arch }}-${{ steps.virgl.outputs.key }}-${{ hashFiles('build/hv.py', 'build/hv-pins.toml') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: hv-check
      - run: just ci::hv-desktop-test
      - run: just ci::hv-test

  # The guest-side crates (cinit, agent, and their proto contracts) are
  # standalone — never swept into the host build — so lint/test them and the
  # agent's cross targets (musl, windows-gnu, apple-darwin) explicitly. clippy
  # on the Windows and macOS targets type-checks without needing a linker.
  guest-crates:
    name: guest crates (cinit + agent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, riscv64gc-unknown-linux-musl, x86_64-pc-windows-gnu, x86_64-apple-darwin
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            guest/cinit-proto
            guest/cinit
            guest/agent-proto
            guest/agent
      - run: just ci::guest-check
      - run: just ci::guest-windows-check
      - run: just ci::guest-macos-check
      - run: just ci::guest-cross-build

  # The committed BPF fast-path objects (src/net/fastpath/bpf/) must match
  # the ebpf/ sources: rebuild with the pinned toolchain and byte-diff.
  # bpf-linker's LLVM proxy dlopens the pinned toolchain's libLLVM, so the
  # objects are deterministic given the rust-toolchain.toml pin + the
  # bpf-linker version pinned in scripts/guest-toolchains.sh (`just ebpf-tools`).
  ebpf-verify:
    name: ebpf objects match source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ebpf/rust-toolchain.toml selects the pinned nightly automatically;
      # install it (with rust-src) up front so cargo doesn't have to.
      - name: Install pinned ebpf toolchain
        run: |
          channel=$(grep '^channel' ebpf/rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$channel" --profile minimal --component rust-src
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ebpf
      - run: just ebpf-tools
      - run: just ci::ebpf-verify

  # ── Version ───────────────────────────────────────────────────────────────
  # Trailer-gated: a release only happens when HEAD carries a publish trailer.
  #   pre-release: true   → X.Y.Z-alpha, marked as a GitHub pre-release
  #   release: true       → X.Y.Z stable
  # Neither → CI runs tests only. The version is bumped from the last v* tag,
  # scanning conventional-commit subjects since that tag for the bump level
  # (0.x semantics: a breaking change bumps the minor, not the major).
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: calc
        # The rules live in scripts/release-version.sh, tested by
        # `just ci::release-version` (VML-104).
        run: |
          set -eu
          ./scripts/release-version.sh > "$RUNNER_TEMP/release.env"
          grep -E '^(do_release|version|prerelease)=' "$RUNNER_TEMP/release.env" >> "$GITHUB_OUTPUT"

          if grep -qx 'do_release=false' "$RUNNER_TEMP/release.env"; then
            echo "No release/pre-release trailer on HEAD — tests only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          VERSION=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release.env")
          PRERELEASE=$(sed -n 's/^prerelease=//p' "$RUNNER_TEMP/release.env")
          BUMP=$(sed -n 's/^bump=//p' "$RUNNER_TEMP/release.env")
          LAST_TAG=$(sed -n 's/^last_tag=//p' "$RUNNER_TEMP/release.env")

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Pre-release** | $PRERELEASE |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── Binary ────────────────────────────────────────────────────────────────
  # Build the version-stamped `vmlab` CLI for Linux x86_64 (vmlab drives
  # QEMU/KVM, so Linux is the only target). It is uploaded for the release job.
  build:
    name: Build vmlab (${{ matrix.target }})
    # The whole merge bar, not only the host job: a release is never cut from
    # a commit any part of `ci::check` rejected.
    needs: [version, check, hv-check, guest-crates, ebpf-verify]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: build-${{ matrix.target }}
      - name: Stamp version
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i '0,/^version = ".*"$/s//version = "'"$V"'"/' Cargo.toml
      - name: Build CLI
        run: cargo build --bin vmlab --release --target ${{ matrix.target }}
      - name: Stage assets
        run: |
          V="${{ needs.version.outputs.version }}"
          cp "target/${{ matrix.target }}/release/vmlab" "vmlab-$V-${{ matrix.suffix }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bin-${{ matrix.target }}
          path: vmlab-${{ needs.version.outputs.version }}-${{ matrix.suffix }}
          retention-days: 1

  vdisplay-build:
    name: Compile Windows display driver
    needs: [version, check, hv-check, guest-crates, ebpf-verify]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # VML-78: apt fails fast on a dead mirror and retries.
      - name: Make apt fail fast
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-vmlab-ci
      - name: Install Windows cross compiler
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18
      # fedorapeople can answer runners with a bot-challenge page, so ivshmem comes from the release asset
      # (tag deps-ivshmem-0.1-161). build.py finds it at its cache path and still checks the sha256 pin.
      - name: Fetch vendored ivshmem archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(jq -r .ivshmem.sha256 guest/vdisplay-windows/dependencies.json)
          mkdir -p .ci-cache/vdisplay-windows
          gh release download deps-ivshmem-0.1-161 --repo "$GITHUB_REPOSITORY" \
            -p virtio-win10-prewhql-0.1-161.zip -O ".ci-cache/vdisplay-windows/ivshmem-$sha.zip"
      - name: Compile against pinned kits
        run: python3 guest/vdisplay-windows/build.py --output target/vdisplay-unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vdisplay-unsigned
          path: target/vdisplay-unsigned
          retention-days: 1

  vdisplay-sign:
    name: Catalog and test-sign Windows display driver
    needs: [version, vdisplay-build]
    if: needs.version.outputs.do_release == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vdisplay-unsigned
          path: target/vdisplay-package
      # build.ps1 verifies every archive against its pin, so a warm cache means no fetch at release time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: C:\vdisplay-tools\downloads
          key: vdisplay-tools-${{ runner.os }}-${{ hashFiles('guest/vdisplay-windows/dependencies.json', 'guest/vdisplay-windows/build-vm/toolchain/toolchain.json') }}
      - name: Sign with pinned SDK and WDK tools
        shell: powershell
        run: ./guest/vdisplay-windows/build.ps1 -Mode sign-only -Package "$PWD/target/vdisplay-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vdisplay-signed
          path: target/vdisplay-package
          retention-days: 1

  # ── Guest assets ──────────────────────────────────────────────────────────
  # Every guest asset the binary looks up on the host — the container micro-VM
  # kernel/initramfs for x86_64 and aarch64, every Rust agent target, every
  # legacy agent target — as one tarball install.sh deploys beside the binary.
  # `just guest-package` is strict: a target whose toolchain is missing fails
  # the job rather than shipping a partial set. scripts/guest-toolchains.sh is
  # the one list of what that takes; this job only caches the two slow stages.
  guest-assets:
    name: Build guest assets
    # This job installs the build container's toolchains directly on the runner.
    env:
      VMLAB_BUILD_ENV: '1'
    needs: [version, check, hv-check, guest-crates, ebpf-verify, vdisplay-sign]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      # VML-78: apt fails fast on a dead mirror and retries.
      - name: Make apt fail fast
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-vmlab-ci
      - name: Install host packages
        timeout-minutes: 20
        run: |
          ./scripts/guest-toolchains.sh apt uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchains
        run: ./scripts/guest-toolchains.sh rust
      # The msvcrt CRT is a ~5 minute build from source; key it on the script
      # that builds it and the mingw-w64 the runner's apt just installed.
      - name: Resolve mingw-w64 version
        id: mingw
        run: echo "version=$(dpkg-query -W -f='${Version}' mingw-w64-common)" >> "$GITHUB_OUTPUT"
      # Both caches sit at the default locations the build scripts look in.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/vmlab/toolchains/mingw-msvcrt
          key: mingw-msvcrt-${{ runner.os }}-${{ steps.mingw.outputs.version }}-${{ hashFiles('guest/build-mingw-msvcrt.sh', 'scripts/guest-toolchains.sh') }}
      - name: Build msvcrt CRT
        run: ./scripts/guest-toolchains.sh msvcrt
      # OpenWatcom is a pinned 150 MB snapshot; the pin lives in the script.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/opt/open-watcom-v2
          key: open-watcom-${{ runner.os }}-${{ hashFiles('scripts/guest-toolchains.sh') }}
      - name: Install OpenWatcom
        run: ./scripts/guest-toolchains.sh watcom
      # zig, cargo-zigbuild and rcodesign for the macOS agent, all pinned there.
      - name: Install the macOS agent toolchain
        run: ./scripts/guest-toolchains.sh zig
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guest-assets
          workspaces: |
            guest/cinit
            guest/agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vdisplay-signed
          path: guest/vdisplay-windows/target/signed-package
      - name: Build and package
        run: just guest-package "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guest-assets
          path: |
            target/guest-package/vmlab-guest-${{ needs.version.outputs.version }}.tar.gz
            target/guest-package/vmlab-guest-${{ needs.version.outputs.version }}.tar.gz.sha256
          retention-days: 1

  # The hypervisor and viewer share the in-tree protocol crates.
  hv-build:
    name: Build hypervisor bundle
    needs: [version, check, hv-check, guest-crates, ebpf-verify]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just
      - uses: taiki-e/install-action@59efbae88300b1298fd71ecd2fc553f6dcbd1c96 # uv
      # VML-78: apt fails fast on a dead mirror and retries.
      - name: Make apt fail fast
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/80-vmlab-ci
      - name: Install native dependencies
        timeout-minutes: 20
        run: just ci::hv-native-deps-install
      - name: Resolve virglrenderer cache identity
        id: virgl
        run: just ci::hv-cache-key >> "$GITHUB_OUTPUT"
      # Outside target/: rust-cache restores that directory separately.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-cache/virglrenderer-*
          key: hv-${{ runner.os }}-${{ runner.arch }}-${{ steps.virgl.outputs.key }}-${{ hashFiles('build/hv.py', 'build/hv-pins.toml') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: hv-build
          workspaces: . -> target/hv
      - name: Build and check hypervisor bundle
        run: just ci::hv-package "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hv-assets
          path: |
            target/dist/vmlab-hv-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            target/dist/vmlab-hv-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz.sha256
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  # Tag the commit and cut a GitHub (pre-)release with the binary and the
  # guest and hypervisor bundles (and their checksums) attached.
  release:
    name: Create GitHub release
    concurrency:
      group: release
      cancel-in-progress: false
    needs: [version, build, guest-assets, hv-build, release-dry-run]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          name: guest-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          name: hv-assets
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.6.1
      - name: Prepare authenticated release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          python3 scripts/release-assets.py dist "$VERSION"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.bundle \
            --certificate-identity https://github.com/VMLabDev/vmlab/.github/workflows/ci.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**/*
