name: Deploy Site

# Builds the vmlab documentation site (docs/main.wcl -> docs/_site) with the
# `wcl` CLI and deploys it to Cloudflare Pages (project "vmlab", configured in
# wrangler.toml; the vmlab.io custom domain is attached in the Cloudflare
# dashboard). Runs only when docs/ — or the deploy config — change on main, so
# an ordinary code push doesn't trigger a deploy.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'install.sh'
      - 'wrangler.toml'
      - '.github/workflows/deploy-site.yml'

env:
  CARGO_TERM_COLOR: always
  # Pin the wcl CLI to the same rev vmlab uses for wcl_lang in Cargo.toml, so
  # the site renders with the wdoc version it was authored against.
  WCL_REV: ec886d3d297aaaacba050109195d3b464eb5f025

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0  # rust-toolchain.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Cache the built wcl CLI binary, keyed on the pinned rev, to skip the
      # (slow) cargo install on subsequent deploys. It lives in ~/.wcl, not
      # ~/.cargo/bin: Swatinem/rust-cache restores ~/.cargo/bin with a key that
      # ignores WCL_REV, so a wcl of an older rev could sit there.
      - name: Cache wcl CLI
        id: wcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.wcl
          key: wcl-${{ env.WCL_REV }}

      - name: Add wcl CLI to PATH
        run: echo "$HOME/.wcl/bin" >> "$GITHUB_PATH"

      - name: Install wcl CLI
        if: steps.wcl-cache.outputs.cache-hit != 'true'
        # The site render only needs `wcl wdoc`; skip the `wcl editor`
        # frontend build so the runner doesn't need pnpm.
        run: WCL_EDITOR_UI_SKIP=1 cargo install --root "$HOME/.wcl" --git https://github.com/wiltaylor/wcl.git --rev ${{ env.WCL_REV }} --locked wcl

      # Runs on a cache hit and a miss: a stale or broken restored binary
      # fails here with a clear message instead of later in the docs build.
      - name: Check wcl CLI
        run: wcl --version

      - uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just

      - name: Build docs site
        run: just docs-build

      # Ship the installer at the site root so the curl one-liner resolves
      # (https://vmlab.io/install.sh). docs/_site is rebuilt each deploy, so the
      # copy lives here, not in the repo.
      - name: Stage install script
        run: cp install.sh docs/_site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
