name: Bug report
description: Something in vmlab doesn't behave the way it should.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: >-
        The `vmlab.wcl` block involved, if any. Trim it to the smallest thing
        that still reproduces.
      render: hcl

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vmlab --version`.
      placeholder: vmlab 0.1.0

  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Linux
        - Windows (WSL2)
        - Official container image
        - Other / not sure
