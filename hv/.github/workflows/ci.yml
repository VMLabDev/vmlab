name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: just ci::check
    runs-on: ubuntu-24.04
    env:
      VIRGL_PREFIX: ${{ github.workspace }}/.ci-cache/virgl
      PKG_CONFIG_PATH: ${{ github.workspace }}/.ci-cache/virgl/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/.ci-cache/virgl/lib
      # Compile every test, but report KVM/guest-only cases as ignored.
      RUSTFLAGS: --cfg vmlab_ci_no_kvm --cfg vmlab_ci_no_host_assets
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just ci::native-deps-install
      - id: virgl-key
        run: just ci::virgl-cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: virgl-cache
        with:
          path: .ci-cache/virgl
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ steps.virgl-key.outputs.key }}-${{ hashFiles('.just/ci/mod.just') }}
      - if: steps.virgl-cache.outputs.cache-hit != 'true'
        run: just ci::virgl-build
      - uses: astral-sh/setup-uv@v6
      - run: just firmware-ipxe-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: just ci::check
