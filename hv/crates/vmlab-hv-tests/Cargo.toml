# The S1 integration harness: spawns the built `vmlab-hv` binary with a
# generated machine description and drives it through every seam the spec
# names for S1 — the control socket, the cinit ctl port, the agent port and
# the network switch socket. A test-support crate only.
[package]
name = "vmlab-hv-tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "S1 integration harness and acceptance tests for vmlab-hv"

[dependencies]
vmlab-hv-proto = { workspace = true }
vmlab-hv-devices = { workspace = true }
vmlab-disk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
wcl_lang = { git = "https://github.com/wiltaylor/wcl.git", rev = "ec886d3d297aaaacba050109195d3b464eb5f025" }

# Wire contracts only; the harness does not depend on vmlab (D18).
vmlab-cinit-proto = { workspace = true }
vmlab-agent-proto = { workspace = true }

parking_lot = { workspace = true }
tempfile = "3"
[lints]
workspace = true
