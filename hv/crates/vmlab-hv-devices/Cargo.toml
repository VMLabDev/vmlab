[package]
name = "vmlab-hv-devices"
description = "Device models for vmlab-hv"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
pipewire = { version = "=0.10.1", optional = true, features = ["v0_3_50"] }
libpulse-binding = { version = "2.30.1", optional = true }
libc = "0.2"
parking_lot = "0.12"
vhost = { version = "0.18.0", features = ["vhost-user-frontend"] }
virtio-queue = "0.18"
vm-memory.workspace = true
vm-superio = "0.8"
vmm-sys-util = "0.15"
vmlab-disk.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[features]
default = []
pipewire = ["dep:pipewire"]
pulse = ["dep:libpulse-binding"]
testing = []
