# Extra conditions on a format class (DESIGN.md G1d).
#
# The LLVM tables describe a disassembler. A record matches on its fixed bits
# alone, and LLVM's C++ decoder methods (which the generator does not run)
# refuse some of those words. Each entry is one such condition, written by
# hand. `require` is a Rust expression over the raw fields of the class, each
# a `u32` under its lower-case name, and over the whole word as `w`, for the
# bits that no field names. A word that fails it does not match the
# record: the decoder tries the next candidate, and decodes to Undefined when
# there is none.
#
# `why` says where the condition comes from: a decoder method of LLVM (S1,
# `Disassembler/AArch64Disassembler.cpp` at the pinned commit), or a run of
# the lockstep against QEMU (S6) that found QEMU taking an Undefined
# Instruction exception.
#
#   [[constraint]]
#   format = "FormatClass"
#   records = ["RecordA"]     # optional: without it, every record of the class
#   require = "imm < 8"
#   why = "..."

[[constraint]]
format = "AddSubImmShift"
require = "imm < 0x2000"
why = "The field is shift:imm12 with a 2-bit shift, and only 0 (LSL #0) and 1 (LSL #12) are add or subtract immediate. LLVM's DecodeAddSubImmShift refuses the others."

[[constraint]]
format = "BaseMoveImmediate"
records = ["MOVNWi", "MOVZWi"]
require = "shift < 32"
why = "The field is the shift in bits: 0, 16, 32 or 48. A 32-bit move wide has a shift of 0 or 16 only. LLVM's DecodeMoveImmInstruction refuses bit 22 on the W records."

[[constraint]]
format = "BaseInsertImmediate"
records = ["MOVKWi"]
require = "shift < 32"
why = "As MOVZWi: LLVM's DecodeMoveImmInstruction refuses bit 22 on the W records."

[[constraint]]
format = "BaseLogicalImm"
require = "crate::fields::logical_immediate_is_valid(imm)"
why = "N:immr:imms must name an element size and a run of ones that is not the whole element. LLVM's DecodeLogicalImmInstruction refuses the rest through AArch64_AM::isValidDecodeLogicalImmediate."

[[constraint]]
format = "BaseAddSubSReg"
records = ["ADDWrs", "ADDSWrs", "SUBWrs", "SUBSWrs"]
require = "shift >> 6 != 3 && shift & 0x20 == 0"
why = "The field is shift:imm6. The shift 3 is reserved for add and subtract, and a 32-bit record has no shift amount above 31. LLVM's DecodeThreeAddrSRegInstruction refuses both."

[[constraint]]
format = "BaseAddSubSReg"
records = ["ADDXrs", "ADDSXrs", "SUBXrs", "SUBSXrs"]
require = "shift >> 6 != 3"
why = "The shift 3 is reserved for add and subtract. LLVM's DecodeThreeAddrSRegInstruction refuses it."

[[constraint]]
format = "BaseLogicalSReg"
records = ["ANDWrs", "ANDSWrs", "BICWrs", "BICSWrs", "ORRWrs", "ORNWrs", "EORWrs", "EONWrs"]
require = "shift & 0x20 == 0"
why = "A 32-bit record has no shift amount above 31. LLVM's DecodeThreeAddrSRegInstruction refuses imm6<5>."

[[constraint]]
format = "BaseAddSubEReg"
require = "extend & 7 <= 4"
why = "The left shift of an extended register is 0 to 4. LLVM's DecodeAddSubERegInstruction refuses the others."

[[constraint]]
format = "BaseAddSubEReg64"
require = "ext & 7 <= 4"
why = "As BaseAddSubEReg: LLVM's DecodeAddSubERegInstruction refuses a shift above 4."

[[constraint]]
format = "RtSystemI128"
require = "rt & 1 == 0"
why = "MRRS and MSRR take a pair of registers that starts at an even one. LLVM's DecodeGPRSeqPairsClassRegisterClass refuses an odd number."

[[constraint]]
format = "SystemPXtI"
require = "rt & 1 == 0"
why = "SYSP takes a pair of registers that starts at an even one (31 is SYSPxt_XZR, a record of its own). LLVM's DecodeGPRSeqPairsClassRegisterClass refuses an odd number."

[[constraint]]
format = "MSRpstateImm0_15"
require = "crate::fields::pstate_imm0_15_is_known(pstatefield)"
why = "The record is an MSR to a PSTATE field of the PStateImm0_15 table whose features are selected. LLVM's DecodeSystemPStateImm0_15Instruction refuses the rest, and the word decodes as the next candidate."

[[constraint]]
format = "MSRpstateImm0_1"
require = "crate::fields::pstate_imm0_1_is_known(pstatefield)"
why = "As MSRpstateImm0_15, for the PStateImm0_1 table: LLVM's DecodeSystemPStateImm0_1Instruction."

[[constraint]]
format = "PstateWriteSimple"
require = "crate::fields::svcr_is_known(pstatefield)"
why = "The operand is an entry of the SVCR table. LLVM's DecodeSVCROp refuses the other values and does not ask for the feature of the entry (SME), so neither does this. The system card (C6) decides what the CPU of the 3d set does with the record."

[[constraint]]
format = "BasePrefetchRO"
require = "rt & 0x18 != 0x18"
why = "A prefetch operation 0b11xxx with a register offset is RPRFM. LLVM's DecodePRFMRegInstruction refuses it here, and the Fallback record RPRFM takes it."

[[constraint]]
format = "LoadAcquire"
require = "(w >> 16) & 0x1f == 0x1f && (w >> 10) & 0x1f == 0x1f"
why = "The bits 20 to 16 and 14 to 10 of LDAR are ones. LLVM marks them SoftFail, so the generator leaves them free. QEMU takes an Undefined Instruction exception unless all ten are ones (lockstep probe on QEMU 11.1.3: c8dffc41 runs, c8c0fc41 and c8df8041 do not). For LDXR and STXR QEMU ignores the same bits, so those stay free."

[[constraint]]
format = "StoreRelease"
require = "(w >> 16) & 0x1f == 0x1f && (w >> 10) & 0x1f == 0x1f"
why = "As LoadAcquire, for STLR (lockstep probe on QEMU 11.1.3: c89ffc41 runs, c880fc41 and c89f8041 do not)."
