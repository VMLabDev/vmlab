[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/VMLabDev/vmlab-hypervisor"
rust-version = "1.99"

[workspace.dependencies]
vmlab-hv-proto = { path = "crates/vmlab-hv-proto" }
vmlab-disk = { path = "crates/vmlab-disk" }
vmlab-hv-devices = { path = "crates/vmlab-hv-devices" }
vmlab-hv-firmware = { path = "crates/vmlab-hv-firmware" }
vmlab-hv-vmm = { path = "crates/vmlab-hv-vmm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
vm-memory = { version = "0.18", features = ["backend-mmap", "backend-bitmap"] }
kvm-ioctls = "0.21"
kvm-bindings = "0.11"
linux-loader = { version = "0.14", features = ["bzimage"] }
acpi_tables = "0.2"
libc = "0.2"
parking_lot = "0.12"
zerocopy = { version = "0.8", features = ["derive"] }
sha2 = "0.10"
flate2 = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# The vendored FUSE stack (crates/vmlab-hv-devices/src/virtio/fs/fuse) keeps
# fuse-backend-rs's feature gates; this build only ever compiles the
# virtqueue path, and the values below keep the dead gates from warning.
unexpected_cfgs = { level = "deny", check-cfg = [
    'cfg(feature, values("async-io", "fuse-t", "fusedev", "macfuse", "persist", "vhost-user-fs", "virtiofs"))',
] }


[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
